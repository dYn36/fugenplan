name: Tests und Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Node.js einrichten
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Abhängigkeiten installieren
        run: npm ci
      - name: Tests und Produktionsbuild
        run: npm run check
  pdf-storage:
    name: PDF-Speicherung nach Browser-Neustart
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Node.js einrichten
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Abhängigkeiten installieren
        run: npm ci
      - name: Chromium und WebKit bereitstellen
        run: npx playwright install --with-deps chromium webkit
      - name: Produktionsbuild
        run: npm run build
      - name: PDF-Speicherung in beiden Browsern prüfen
        run: npm run test:e2e:all -- tests/pdf-storage.e2e.spec.ts
      - name: Browserbericht sichern
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pdf-speicher-pruefung
          path: test-results/
          retention-days: 14
