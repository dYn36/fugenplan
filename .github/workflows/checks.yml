name: Tests und Build

on:
  push:
    branches: [main, netlify-preview]
  pull_request:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Node.js einrichten
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Abhängigkeiten installieren
        run: npm ci
      - name: Bekannte Schwachstellen prüfen
        run: npm audit --audit-level=moderate
      - name: Tests und Produktionsbuild
        run: npm run check
  browser:
    name: Browserabläufe und PDF-Speicherung
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Quellcode auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Node.js einrichten
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Abhängigkeiten installieren
        run: npm ci
      - name: Chromium und WebKit bereitstellen
        run: npx playwright install --with-deps chromium webkit
      - name: Produktionsbuild
        run: npm run build
      - name: Alle Abläufe in Chromium und WebKit prüfen
        run: npm run test:e2e:all
      - name: Browserbericht sichern
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: browser-pruefung
          path: test-results/
          retention-days: 14
