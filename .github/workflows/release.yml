name: GitHub-Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Welche Stelle der Paketversion soll steigen?
        type: choice
        required: true
        default: patch
        options: [patch, minor, major]
  pull_request:
    branches: [main]
    types: [closed]

permissions: {}

jobs:
  vorbereiten:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    concurrency:
      group: fugenplan-release-vorbereiten
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Paketversion erhöhen und Release-Notizen vorbereiten
        id: version
        env:
          BUMP: ${{ inputs.bump }}
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/release.mjs prepare
      - name: Release-PR erstellen oder aktualisieren
        id: pr
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          base: main
          branch: release/version
          add-paths: |
            package.json
            package-lock.json
          commit-message: 'chore(release): ${{ steps.version.outputs.tag }}'
          title: 'Release ${{ steps.version.outputs.tag }}'
          body-path: ${{ runner.temp }}/fugenplan-release-pr.md
      - name: Release-PR anzeigen
        env:
          PR_URL: ${{ steps.pr.outputs.pull-request-url }}
        run: echo "[Release-PR öffnen]($PR_URL)" >> "$GITHUB_STEP_SUMMARY"

  veroeffentlichen:
    if: >-
      github.event_name == 'pull_request' && github.event.pull_request.merged &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.head.ref == 'release/version' &&
      github.event.pull_request.user.login == 'github-actions[bot]'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: read
    concurrency:
      group: fugenplan-release-publizieren-${{ github.event.pull_request.number }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.merge_commit_sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Geprüften Versionsstand taggen und auf GitHub veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: node .github/scripts/release.mjs publish
