name: Zugangsdaten und Doku-Links

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: repository-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  repository:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Git-Historie auschecken
        id: checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Git-Historie auf Zugangsdaten prüfen
        run: |
          docker run --rm --network none --volume "$GITHUB_WORKSPACE:/repo:ro" --workdir /repo \
            ghcr.io/gitleaks/gitleaks:v8.30.1@sha256:c00b6bd0aeb3071cbcb79009cb16a60dd9e0a7c60e2be9ab65d25e6bc8abbb7f \
            git --redact=100 --no-banner --ignore-gitleaks-allow \
            --log-opts="--full-history --diff-merges=first-parent HEAD" .

      - name: Lokale Links, Sprungziele und Bilder prüfen
        if: ${{ !cancelled() && steps.checkout.outcome == 'success' }}
        shell: bash
        run: |
          git ls-files -z -- '*.md' | xargs -0 docker run --rm --network none \
            --volume "$GITHUB_WORKSPACE:/repo:ro" --workdir /repo \
            lycheeverse/lychee:0.24.2@sha256:e2d19e57cf6ab037026f20b8e449a1f30d9d7f81eef4194763aab2eab20bd28d \
            --offline --include-fragments=anchor-only --no-progress --
