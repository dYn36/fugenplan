name: PR-Beschreibung

on:
  pull_request:
    branches: [main]
    types: [opened, edited, reopened, synchronize, ready_for_review, converted_to_draft]

permissions:
  contents: read

concurrency:
  group: pr-beschreibung-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  beschreibung:
    name: Angaben in der PR-Vorlage
    if: ${{ !github.event.pull_request.draft && github.event.pull_request.user.login != 'dependabot[bot]' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 3
    steps:
      - name: PR mit seinem Zielstand auschecken
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
          persist-credentials: false
      - name: Node.js einrichten
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          package-manager-cache: false
      - name: Angaben für die geänderten Bereiche prüfen
        run: node .github/scripts/pr-beschreibung.mjs
